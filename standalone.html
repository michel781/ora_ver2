<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ORA Test Screen</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.5;
  color: rgba(255,255,255,0.87);
  background-color: #242424;
}
body { min-height: 100vh; display: flex; place-items: center; }
button {
  border-radius: 8px; border: 1px solid transparent;
  padding: 0.6em 1.2em; font-size: 1em; font-weight: 500;
  font-family: inherit; background-color: #1a1a1a;
  cursor: pointer; transition: border-color 0.25s;
}
button:hover { border-color: #646cff; }
.app {
  max-width: 640px; margin: 0 auto; padding: 1.5rem;
  min-height: 100vh; display: flex; flex-direction: column; width: 100%;
}
.app-header { text-align: center; margin-bottom: 1.5rem; }
.app-header h1 { font-size: 2rem; margin: 0; color: #646cff; }
.subtitle { color: #888; margin: 0.25rem 0 0; }
.tabs {
  display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
  border-bottom: 2px solid #333; padding-bottom: 0.5rem;
}
.tab {
  flex: 1; padding: 0.6rem 1rem; border: none;
  border-radius: 8px 8px 0 0; background: transparent;
  color: #888; cursor: pointer; font-size: 0.95rem; transition: all 0.2s;
}
.tab:hover { color: #fff; background: rgba(100,108,255,0.1); }
.tab.active { color: #646cff; background: rgba(100,108,255,0.15); font-weight: 600; }
.content { flex: 1; }
.card {
  background: rgba(255,255,255,0.05); border-radius: 12px;
  padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1);
}
.card h2 { margin: 0 0 1rem; font-size: 1.25rem; }
.counter-display {
  font-size: 4rem; font-weight: 700; text-align: center;
  padding: 1rem; color: #646cff;
}
.counter-buttons { display: flex; gap: 0.75rem; justify-content: center; }
.counter-buttons button {
  min-width: 80px; padding: 0.6rem 1.2rem; border-radius: 8px;
  border: 1px solid #646cff; background: rgba(100,108,255,0.1);
  color: #fff; font-size: 1rem; cursor: pointer; transition: all 0.2s;
}
.counter-buttons button:hover { background: rgba(100,108,255,0.3); }
.reset {
  border-color: #ff6b6b !important; background: rgba(255,107,107,0.1) !important;
  color: #ff6b6b !important;
}
.reset:hover { background: rgba(255,107,107,0.3) !important; }
.input-group { display: flex; gap: 0.5rem; }
.input-group input {
  flex: 1; padding: 0.75rem 1rem; border-radius: 8px;
  border: 1px solid #444; background: rgba(0,0,0,0.3);
  color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s;
}
.input-group input:focus { border-color: #646cff; }
.input-group button {
  padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
  background: #646cff; color: #fff; font-size: 1rem;
  cursor: pointer; transition: background 0.2s;
}
.input-group button:hover { background: #535bf2; }
.preview {
  margin-top: 1rem; padding: 0.75rem;
  background: rgba(100,108,255,0.1); border-radius: 8px;
  color: #aaa; font-style: italic;
}
.empty { text-align: center; color: #666; padding: 2rem; }
.message-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.message-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.75rem 1rem; background: rgba(0,0,0,0.2);
  border-radius: 8px; border-left: 3px solid #646cff;
}
.message-text { color: #ddd; }
.message-time { color: #666; font-size: 0.8rem; white-space: nowrap; margin-left: 1rem; }
.app-footer {
  text-align: center; padding: 1.5rem 0 0.5rem;
  color: #555; font-size: 0.85rem; margin-top: auto;
}
.hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>ORA Test Screen</h1>
    <p class="subtitle">테스트 화면</p>
  </header>

  <nav class="tabs">
    <button class="tab active" onclick="switchTab('counter')">카운터</button>
    <button class="tab" onclick="switchTab('input')">입력 테스트</button>
    <button class="tab" id="msgTab" onclick="switchTab('messages')">메시지 (0)</button>
  </nav>

  <main class="content">
    <section id="counter" class="card">
      <h2>카운터 테스트</h2>
      <div class="counter-display" id="countDisplay">0</div>
      <div class="counter-buttons">
        <button onclick="changeCount(-1)">- 1</button>
        <button class="reset" onclick="changeCount(0)">초기화</button>
        <button onclick="changeCount(1)">+ 1</button>
      </div>
    </section>

    <section id="input" class="card hidden">
      <h2>입력 테스트</h2>
      <div class="input-group">
        <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." oninput="updatePreview()" onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">전송</button>
      </div>
      <p class="preview hidden" id="preview"></p>
    </section>

    <section id="messages" class="card hidden">
      <h2>메시지 목록</h2>
      <p class="empty" id="emptyMsg">"입력 테스트" 탭에서 메시지를 추가해보세요.</p>
      <ul class="message-list" id="msgList"></ul>
      <button class="reset hidden" id="clearBtn" onclick="clearMessages()" style="margin-top:1rem;width:100%">전체 삭제</button>
    </section>
  </main>

  <footer class="app-footer">
    <p>ORA v2 - 테스트 환경</p>
  </footer>
</div>

<script>
var count = 0;
var messages = [];

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('active', ['counter','input','messages'][i] === tab);
  });
  ['counter','input','messages'].forEach(function(id) {
    document.getElementById(id).classList.toggle('hidden', id !== tab);
  });
}

function changeCount(v) {
  if (v === 0) count = 0; else count += v;
  document.getElementById('countDisplay').textContent = count;
}

function updatePreview() {
  var val = document.getElementById('msgInput').value;
  var prev = document.getElementById('preview');
  if (val) {
    prev.textContent = '\ubbf8\ub9ac\ubcf4\uae30: ' + val;
    prev.classList.remove('hidden');
  } else {
    prev.classList.add('hidden');
  }
}

function sendMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  messages.push({ text: text, time: new Date().toLocaleTimeString() });
  input.value = '';
  document.getElementById('preview').classList.add('hidden');
  renderMessages();
}

function renderMessages() {
  var list = document.getElementById('msgList');
  var empty = document.getElementById('emptyMsg');
  var clearBtn = document.getElementById('clearBtn');
  document.getElementById('msgTab').textContent = '\uba54\uc2dc\uc9c0 (' + messages.length + ')';
  if (messages.length === 0) {
    empty.classList.remove('hidden');
    clearBtn.classList.add('hidden');
    list.innerHTML = '';
    return;
  }
  empty.classList.add('hidden');
  clearBtn.classList.remove('hidden');
  list.innerHTML = messages.map(function(m) {
    return '<li class="message-item"><span class="message-text">' +
      m.text.replace(/</g,'&lt;').replace(/>/g,'&gt;') +
      '</span><span class="message-time">' + m.time + '</span></li>';
  }).join('');
}

function clearMessages() {
  messages = [];
  renderMessages();
}
</script>
</body>
</html>
